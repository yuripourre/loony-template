<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Loony Game</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #10161d;
                font-family: system-ui, sans-serif;
            }
            #renderCanvas {
                width: 100%;
                height: 100%;
                display: block;
                touch-action: none;
                outline: none;
            }
            #start-menu {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                color: #e8eef4;
                background: #10161dee;
            }
            #start-menu h1 {
                margin: 0 0 8px;
                font-size: 40px;
            }
            #start-menu button {
                min-width: 260px;
                padding: 14px 24px;
                font-size: 18px;
                color: #e8eef4;
                background: #24405c;
                border: 1px solid #4a7aa8;
                border-radius: 8px;
                cursor: pointer;
            }
            #start-menu button:hover {
                background: #2f5478;
            }
            #start-menu p {
                margin: 8px 0 0;
                opacity: 0.7;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas"></canvas>
        <div id="start-menu">
            <h1 id="game-title">My Loony Game</h1>
            <button data-mode="fps">First-person shooter demo</button>
            <button data-mode="vr">VR demo</button>
            <p>FPS: click to lock the mouse · WASD move · Space jump · click to shoot</p>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
